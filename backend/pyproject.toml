[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own documented pattern is `param: X = Depends(...)` -- a function
# call as a default argument. B008 flags function-calls-as-defaults as a
# general Python anti-pattern (mutable default trap), which is correct
# everywhere except here: FastAPI evaluates these per-request, not once at
# import time. Telling bugbear these specific calls are safe keeps B008
# active for genuine mutable-default bugs elsewhere.
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*", "app/main.py"]

[tool.coverage.report]
# 80% is Milestone 1.5's coverage target for core logic (models, security,
# services, repositories). This is not yet enforced as a hard CI gate
# (`fail_under`) because Phase 1 code includes plumbing (schemas, router
# wiring) that inflates the denominator without needing dedicated tests.
# Revisit once Stage 2 features add real business logic to measure against.
show_missing = true
