name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartarchive
          POSTGRES_PASSWORD: smartarchive_test_password
          POSTGRES_DB: smartarchive_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartarchive -d smartarchive_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://smartarchive:smartarchive_test_password@localhost:5432/smartarchive_test
      POSTGRES_HOST: localhost
      POSTGRES_USER: smartarchive
      POSTGRES_PASSWORD: smartarchive_test_password
      POSTGRES_DB: smartarchive_test
      REDIS_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Apply migrations to test database
        run: alembic upgrade head
        env:
          POSTGRES_HOST: localhost
      - name: Test with coverage (unit + integration)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Lint (eslint)
        run: npm run lint
      - name: Build
        run: npm run build
